<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <!-- Subtle shadow filter -->
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="920" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a" letter-spacing="0.3">Zero-Shot LLM Code Generation vs Retrieval-Augmented Code Generation (RAG)</text>

  <!-- Vertical separator -->
  <line x1="600" y1="50" x2="600" y2="870" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- ===================== LEFT PANEL: Zero-Shot ===================== -->

  <!-- Panel label -->
  <text x="300" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#555555">Traditional Zero-Shot Generation</text>

  <!-- Equation above panel -->
  <text x="300" y="100" text-anchor="middle" font-size="13" fill="#333333" font-style="italic">c = argmax P(c | q ; Θ)</text>

  <!-- User Query -->
  <rect x="200" y="130" width="200" height="44" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="300" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">User Query</text>

  <!-- Arrow 1 -->
  <line x1="300" y1="174" x2="300" y2="230" stroke="#444" stroke-width="1.3" marker-end="url(#arrowhead)"/>

  <!-- Cloud shape behind LLM (Parametric Knowledge) -->
  <ellipse cx="300" cy="290" rx="170" ry="85" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="300" y="345" text-anchor="middle" font-size="10.5" fill="#888888" font-style="italic">Parametric Knowledge</text>
  <text x="300" y="360" text-anchor="middle" font-size="10.5" fill="#888888" font-style="italic">(Model Weights Only)</text>

  <!-- LLM block -->
  <rect x="200" y="242" width="200" height="52" rx="4" fill="#e8e8e8" stroke="#888888" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="300" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">Large Language Model</text>
  <text x="300" y="282" text-anchor="middle" font-size="11" fill="#666666">(LLM)</text>

  <!-- Arrow 2 -->
  <line x1="300" y1="370" x2="300" y2="420" stroke="#444" stroke-width="1.3" marker-end="url(#arrowhead)"/>

  <!-- Generated Code -->
  <rect x="200" y="430" width="200" height="44" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="300" y="457" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">Generated Code</text>

  <!-- Annotations under left panel -->
  <text x="300" y="520" text-anchor="middle" font-size="11" fill="#777777">• No external knowledge grounding</text>
  <text x="300" y="540" text-anchor="middle" font-size="11" fill="#777777">• Higher hallucination risk</text>
  <text x="300" y="560" text-anchor="middle" font-size="11" fill="#777777">• Pure autoregressive decoding</text>


  <!-- ===================== RIGHT PANEL: RAG ===================== -->

  <!-- Panel label -->
  <text x="900" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#2e7d32">Retrieval-Augmented Generation (RAG-Based)</text>

  <!-- Equation above panel -->
  <text x="900" y="100" text-anchor="middle" font-size="13" fill="#333333" font-style="italic">c = argmax P(c | q, C_k ; Θ)</text>

  <!-- User Query -->
  <rect x="800" y="130" width="200" height="40" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="900" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2e7d32">User Query</text>

  <!-- Arrow -->
  <line x1="900" y1="170" x2="900" y2="192" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arrowhead-green)"/>

  <!-- Intent Normalization -->
  <rect x="800" y="198" width="200" height="40" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="900" y="223" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2e7d32">Intent Normalization</text>

  <!-- Arrow -->
  <line x1="900" y1="238" x2="900" y2="258" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arrowhead-green)"/>

  <!-- Embedding Model -->
  <rect x="800" y="264" width="200" height="40" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="900" y="289" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2e7d32">Embedding Model</text>

  <!-- Arrow -->
  <line x1="900" y1="304" x2="900" y2="324" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arrowhead-green)"/>

  <!-- Vector Database block -->
  <rect x="800" y="330" width="200" height="40" rx="4" fill="#c8e6c9" stroke="#43a047" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="900" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#1b5e20">Vector Database</text>
  <text x="900" y="365" text-anchor="middle" font-size="10.5" fill="#2e7d32">(FAISS Index)</text>

  <!-- Database cylinder on the side -->
  <g transform="translate(1065, 322)">
    <!-- Cylinder body -->
    <rect x="0" y="8" width="50" height="38" rx="0" fill="#a5d6a7" stroke="#43a047" stroke-width="1.2"/>
    <!-- Top ellipse -->
    <ellipse cx="25" cy="10" rx="25" ry="10" fill="#c8e6c9" stroke="#43a047" stroke-width="1.2"/>
    <!-- Bottom ellipse (half) -->
    <path d="M 0,46 A 25,10 0 0,0 50,46" fill="#a5d6a7" stroke="#43a047" stroke-width="1.2"/>
    <text x="25" y="35" text-anchor="middle" font-size="8" fill="#1b5e20" font-weight="600">FAISS</text>
  </g>
  <!-- Connector from cylinder to block -->
  <line x1="1000" y1="350" x2="1062" y2="350" stroke="#43a047" stroke-width="1.1" stroke-dasharray="4,3"/>

  <!-- Arrow -->
  <line x1="900" y1="370" x2="900" y2="390" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arrowhead-green)"/>

  <!-- Retrieved Patterns -->
  <rect x="800" y="396" width="200" height="40" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="900" y="416" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7d32">Retrieved Patterns</text>
  <text x="900" y="430" text-anchor="middle" font-size="10.5" fill="#2e7d32">(Top-k)</text>

  <!-- Arrow -->
  <line x1="900" y1="436" x2="900" y2="456" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arrowhead-green)"/>

  <!-- Prompt Augmentation -->
  <rect x="800" y="462" width="200" height="40" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="900" y="487" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2e7d32">Prompt Augmentation</text>

  <!-- Arrow -->
  <line x1="900" y1="502" x2="900" y2="522" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arrowhead-green)"/>

  <!-- LLM block -->
  <rect x="800" y="528" width="200" height="44" rx="4" fill="#c8e6c9" stroke="#43a047" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="900" y="548" text-anchor="middle" font-size="13" font-weight="600" fill="#1b5e20">Large Language Model</text>
  <text x="900" y="564" text-anchor="middle" font-size="11" fill="#2e7d32">(LLM)</text>

  <!-- Arrow -->
  <line x1="900" y1="572" x2="900" y2="598" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arrowhead-green)"/>

  <!-- Generated Code -->
  <rect x="800" y="604" width="200" height="40" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="900" y="629" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2e7d32">Generated Code</text>

  <!-- Annotations under right panel -->
  <text x="900" y="690" text-anchor="middle" font-size="11" fill="#2e7d32">• External semantic grounding</text>
  <text x="900" y="710" text-anchor="middle" font-size="11" fill="#2e7d32">• Pattern-aligned synthesis</text>
  <text x="900" y="730" text-anchor="middle" font-size="11" fill="#2e7d32">• Reduced hallucination</text>

  <!-- Figure caption -->
  <text x="600" y="890" text-anchor="middle" font-size="12" fill="#555555" font-weight="600">Fig. 2.</text>
  <text x="632" y="890" text-anchor="start" font-size="12" fill="#555555"> Architectural comparison of Zero-Shot and Retrieval-Augmented Code Generation pipelines.</text>
</svg>
